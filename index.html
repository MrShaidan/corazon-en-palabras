<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000">
<meta name="description" content="Un corazón que se dibuja con te amo en muchos idiomas."><title>Te amo en mil palabras</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{min-height:100svh;touch-action:manipulation}canvas{display:block;width:100%;height:100%}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style>
</head>
<body><h1 class="sr-only">Un corazón hecho de «te amo» en muchos idiomas.</h1><canvas aria-label="Animación de un corazón rojo y rosa que se forma con palabras de amor." role="img"></canvas>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const phrases=['Te amo','I love you','Je t’aime','Ti amo','Eu te amo','Ich liebe dich','愛してる','사랑해','我爱你','أحبك','Я тебя люблю','Seni seviyorum','Σ’ αγαπώ','Ik hou van jou','Jag älskar dig','Kocham cię','Mahal kita','Anh yêu em','ฉันรักคุณ','मैं तुमसे प्यार करता हूँ','T’estimo','Maite zaitut','Aloha wau iā ʻoe'];
let width=0,height=0,scale=1,particles=[],start=performance.now(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=73041;function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
function heart(t){return{x:16*Math.sin(t)**3,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}}
const outline=Array.from({length:240},(_,i)=>heart(i/240*Math.PI*2));
function inside(x,y){let hit=false;for(let i=0,j=outline.length-1;i<outline.length;j=i++){const a=outline[i],b=outline[j];if((a.y>y)!=(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)hit=!hit}return hit}
function layout(){width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(width*.88/34,height*.72/32);seed=73041;particles=[];
// The contour is written first, followed by little horizontal lines of love.
for(let i=0;i<100;i++){const t=i/100*Math.PI*2,p=heart(t);particles.push({x:p.x,y:p.y,text:phrases[i%phrases.length],size:.42+random()*.13,delay:i/100*3.8,hue:342+random()*18,angle:0,phase:random()*6.28})}
let index=0;for(let y=-12.2;y<16.8;y+=.7){for(let x=-15.2;x<15.3;){const phrase=phrases[Math.floor(random()*phrases.length)],size=.46+random()*.10;ctx.font=`${size*scale}px Georgia,serif`;const units=ctx.measureText(phrase).width/scale+.32;if(inside(x,y)&&inside(x+units,y)){particles.push({x:x+units/2,y,text:phrase,size,delay:4+(y+12.2)/29*5.8+random()*.55,hue:337+random()*25,angle:0,phase:random()*6.28});index++}x+=units}}
}
function frame(now){const time=(now-start)/1000;ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);const pulse=reduced?1:1+Math.sin(Math.max(0,time-9)*2.1)*.009*Math.min(1,Math.max(0,time-9));ctx.save();ctx.translate(width/2,height/2-scale*.6);ctx.scale(pulse,pulse);ctx.textAlign='center';ctx.textBaseline='middle';for(const p of particles){let age=reduced?5:time-p.delay;if(age<0)continue;const alpha=Math.min(1,age/1.1);const arrival=reduced?0:Math.pow(1-Math.min(1,age/1.5),3);const x=p.x*scale,y=p.y*scale;ctx.save();ctx.translate(x+(x*.4)*arrival,y-32*arrival);ctx.globalAlpha=alpha*(.78+.22*Math.sin(time*.7+p.phase)**2);ctx.font=`${p.size*scale}px Georgia,"Times New Roman",serif`;ctx.fillStyle=`hsl(${p.hue} 100% ${57+Math.sin(p.phase)*10}%)`;ctx.shadowColor='#ff2459';ctx.shadowBlur=age<1.5?7:1.2;ctx.fillText(p.text,0,0);ctx.restore()}ctx.restore();if(!reduced)requestAnimationFrame(frame)}
layout();requestAnimationFrame(frame);let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{layout();if(reduced)frame(performance.now())},80)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&reduced)frame(performance.now())});
</script></body></html>
